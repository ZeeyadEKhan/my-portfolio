<!--
  CANONICAL SITE NAVIGATION - single source of truth

  This site is static HTML with no build step, so the nav cannot be a true
  shared include without adding a build tool or client side JS injection
  (both rejected: JS injection flashes on load and hides the nav from
  no script rendering; a build step is out of scope for this site).

  When the nav changes, update it HERE FIRST, then copy it into the
  <nav class="topbar-nav"> block of every page listed below. The only
  per page difference allowed is class="active" (plus aria-current on
  the link for the page being edited).

  Pages that must stay in sync (15):
    index.html
    about.html
    contact.html
    explorations.html
    projects/adey/index.html
    projects/baloo/index.html
    projects/depositproof/index.html
    projects/explorius/index.html
    projects/insuranceappeal/index.html
    projects/legaleey/index.html
    projects/lumi/index.html
    projects/medsummary/index.html
    projects/persona-generator/index.html
    projects/wonderbudi/index.html
    projects/zarrin/index.html

  Sync check (run from repo root; every page's normalized nav must match):
    python3 -c "
    import re, glob
    navs = set()
    for f in sorted(glob.glob('*.html') + glob.glob('projects/*/index.html')):
        m = re.search(r'<nav[^>]*>(.*?)</nav>', open(f).read(), re.S)
        nav = re.sub(r'\s*(class=\"[^\"]*\"|aria-current=\"[^\"]*\")', '', re.sub(r'\s+', ' ', m.group(1)).strip())
        navs.add(nav)
    print('IN SYNC' if len(navs) == 1 else 'DRIFT DETECTED')"
-->
